name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  rust-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:latest
      options: --privileged --user root
    steps:
      - uses: actions/checkout@v6

      - name: Start Radicale
        run: radicale &

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:latest
      options: --privileged --user root
    steps:
      - uses: actions/checkout@v6

      - name: Start Radicale
        run: radicale &

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

  flatpak:
    needs: [check, rust-tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: net.kurowski.potasko.yml
          bundle: potasko.flatpak
          upload-artifact: true
          cache-key: flatpak-builder-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock') }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: potasko.flatpak
