[package]
name = "potasko-gui"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "potasko-gui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "potasko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "potasko"
path = "src/bin/cli.rs"

[[bin]]
name = "potasko-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }

# Data types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"

# HTTP client (for CalDAV)
# Use rustls-tls-webpki-roots to bundle Mozilla's root certificates
# This avoids platform-specific TLS complexity while working on Android
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

# XML parsing (for CalDAV)
quick-xml = "0.38"
roxmltree = "0.21"

# CLI
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
dirs = "6.0"

# iCalendar/VTODO
icalendar = { version = "0.17", features = ["parser"] }
rrule = "0.14"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
serial_test = "3.3.1"

